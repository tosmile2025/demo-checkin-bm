<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าเวลาสาย | ศูนย์แพทย์ พุทธชินราช</title>
    <link rel="icon" type="image/png" href="logo-sm.png" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Noto Sans Thai"', 'sans-serif'] }, colors: { medical: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a' } } } } }
    </script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans p-4 sm:p-8 min-h-screen">
    <div class="max-w-3xl mx-auto w-full">
        <!-- ส่วนหัว -->
        <div
            class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4 bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
            <div class="flex items-center gap-4">
                <div
                    class="bg-medical-50 text-medical-600 w-12 h-12 rounded-2xl flex items-center justify-center text-xl border border-medical-100 shadow-inner">
                    <i class="fas fa-clock"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800">ตั้งค่าเวลาทำงาน</h1>
                    <p class="text-xs text-slate-500 mt-0.5">กำหนดเวลาสาย/ออกก่อน ตามหมวดหมู่การลงเวลา</p>
                </div>
            </div>
            <a href="admin.html"
                class="w-full sm:w-auto text-center bg-slate-100 text-slate-700 px-5 py-2.5 rounded-xl font-bold hover:bg-slate-200 transition shadow-sm">
                <i class="fas fa-arrow-left mr-2"></i> กลับแดชบอร์ด
            </a>
        </div>

        <!-- รายการหมวดหมู่ -->
        <div class="bg-white p-6 rounded-3xl shadow-md border border-slate-100">
            <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
                <h2 class="font-bold text-medical-700 text-lg"><i class="fas fa-list-ul mr-2"></i> หมวดและการตั้งเวลา
                </h2>
                <button onclick="addTimeRow()"
                    class="bg-medical-100 text-medical-700 hover:bg-medical-200 px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm">
                    <i class="fas fa-plus"></i> เพิ่มหมวดใหม่
                </button>
            </div>

            <div id="timeList" class="space-y-3 mb-6">
                <div class="text-center text-slate-400 py-6"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                    <p>กำลังโหลดข้อมูล...</p>
                </div>
            </div>

            <button onclick="saveAllSettings()" id="saveBtn"
                class="w-full bg-medical-700 text-white font-bold py-3.5 rounded-xl shadow-lg hover:bg-medical-800 transition">
                <i class="fas fa-save mr-2"></i> บันทึกการตั้งค่า
            </button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="admin-time.js"></script>
</body>

</html>
